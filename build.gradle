plugins {
    id 'java'
    id 'application'
    // Builds a "fat" JAR: our classes plus every dependency in one runnable file,
    // so the chatbot can be handed to someone who only has Java installed.
    // The plugin moved from com.github.johnrengelman to com.gradleup when the
    // original was no longer maintained; the old one cannot run on Gradle 8+.
    id 'com.gradleup.shadow' version '9.6.1'
    // Measures how much of the code the tests actually reach, so the coverage
    // target in AGENTS.md is a number we can check rather than a guess.
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    // Compile and run against Java 25 no matter which JDK happens to be first on
    // the PATH. Gradle downloads a matching JDK if it cannot find one installed,
    // so the build behaves the same on another machine.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // junit-jupiter bundles the api (what tests are written against) and the
    // engine (what runs them). The platform launcher used to be pulled in
    // automatically; from Gradle 9 it has to be asked for by name, or the test
    // task fails with "Failed to load JUnit Platform".
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '5.14.4'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

jacoco {
    // 0.8.15 is the first release that understands Java 25 class files.
    toolVersion = "0.8.15"
}

jacocoTestReport {
    // The report is only meaningful once the tests have run.
    dependsOn test

    reports {
        html.required = true
        xml.required = false
    }
}

// Make "gradlew test" produce the coverage report too, so it never goes stale.
test.finalizedBy jacocoTestReport

application {
    mainClass = "lebronjames.LebronJames"
}

shadowJar {
    archiveBaseName = "lebronjames"
    // No classifier, so the file is lebronjames-<version>.jar rather than
    // lebronjames-<version>-all.jar.
    archiveClassifier = ""
}

run {
    // The chatbot reads commands from the keyboard, so the console has to be
    // connected to the running program. Without this, "gradlew run" would see
    // no input at all and exit immediately.
    standardInput = System.in
}

// The application plugin's plain "jar" task also produces build/libs/ip.jar,
// which holds only our classes and is not the file we ever want to hand out.
// Turning it off leaves shadowJar's fat JAR as the single build output.
tasks.named('jar') {
    enabled = false
}
